name: Vérification

on:
  push:
  pull_request:

jobs:
  resultats:
    name: Résultats recalculés à partir du cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Rejouer les 21 conversations et les 24 questions avec les cinq systèmes, et comparer aux résultats publiés
        run: python -m memoire.evaluer --verifier
